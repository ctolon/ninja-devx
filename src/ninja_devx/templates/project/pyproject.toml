[project]
name = "{{ project_name }}"
version = "0.1.0"
description = "A ninja-devx project."
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "django-ninja>=1.7,<2",
    "ninja-devx=={{ ninja_devx_version }}",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
