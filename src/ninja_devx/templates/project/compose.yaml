# Local PostgreSQL for development. Point DATABASE_URL at it (see .env.example) or
# leave it unset to use the default SQLite database.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: {{ project_name }}
      POSTGRES_PASSWORD: {{ project_name }}
      POSTGRES_DB: {{ project_name }}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ project_name }} -d {{ project_name }}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
