[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ninja-devx"
version = "0.0.2"
description = "Developer productivity toolkit for Django Ninja: typed controllers, CRUD, permissions, layers, DI and tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The ninja-devx contributors" }]
keywords = ["django", "django-ninja", "developer productivity", "class-based views", "controllers", "crud", "dependency injection", "openapi"]
dependencies = [
    "django>=4.2",
    "django-ninja>=1.7,<2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ctolon/ninja-devx"
Documentation = "https://ctolon.github.io/ninja-devx/"
Source = "https://github.com/ctolon/ninja-devx"
Changelog = "https://github.com/ctolon/ninja-devx/blob/main/CHANGELOG.md"
Issues = "https://github.com/ctolon/ninja-devx/issues"

[project.optional-dependencies]
dishka = ["dishka>=1.4"]
svcs = ["svcs>=24.1"]
otel = ["opentelemetry-api>=1.20"]
client = ["httpx>=0.27"]
contract = ["schemathesis>=4"]
guardian = [
    "django-guardian>=2.4",
]
orjson = [
    "orjson>=3.9",
]
msgspec = [
    "msgspec>=0.18",
]
s3 = [
    "boto3>=1.34",
]
crypto = [
    "cryptography>=42",
]
redis = [
    "redis>=5",
]
structlog = [
    "structlog>=24",
]
zeal = [
    "django-zeal>=2",
]

[project.entry-points.pytest11]
ninja_devx = "ninja_devx.pytest_plugin"

[dependency-groups]
verification = [
    "coverage>=7.6",
    "psycopg[binary]>=3.2",
    "redis>=5",
    "boto3>=1.34",
    "pip-audit>=2.9",
    "twine>=6",
]
bench = [
    "gunicorn>=23",
    "httpx>=0.28",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "mypy>=1.13",
    "django-stubs>=5.1",
    "pyright>=1.1.390",
    "ruff>=0.8",
    "dishka>=1.4",
    "svcs>=24.1",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "httpx>=0.27",
    "schemathesis>=4",
    "django-guardian>=2.4",
    "orjson>=3.12.0",
    "msgspec>=0.21.1",
    "cryptography>=42",
    "redis>=5",
    "structlog>=24",
    "django-zeal>=2",
]

docs = [
    "mike>=2.1",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ninja_devx"]

[tool.hatch.build.targets.sdist]
include = ["src/ninja_devx", "tests", "docs", "tools", "examples", "benchmarks", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE", "SECURITY.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md", "mkdocs.yml", "uv.lock", "compose.yaml", "docker", ".dockerignore"]
exclude = ["**/__pycache__", "**/*.sqlite3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
pythonpath = ["."]

[tool.coverage.run]
source = ["ninja_devx"]
branch = true
omit = ["*/ninja_devx/unasync.py", "*/migrations/*"]

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    '^\s*\.\.\.$',
    ': \.\.\.$',
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated API clients are checked with `devx_openapi --check`, not reformatted.
# The scaffold's pyproject.toml is a Jinja template, not valid TOML, so ruff's own
# config discovery must not try to parse it.
extend-exclude = ["examples/blog/clients", "src/ninja_devx/templates/project/pyproject.toml"]

[tool.ruff.format]
# Markdown snippet directives are not Python expressions; MkDocs expands them.
# Generated by `python -m ninja_devx.unasync` (checked by tests/test_unasync.py).
exclude = [
    "**/*.md",
    "src/ninja_devx/_permission_eval.py",
    # Generated by tools/generate_docs.py (checked by tests/test_generated_docs.py).
    "docs/options/*.md",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012"]
"tests/typing/**" = ["RUF012", "E402"]
# Markdown tables and generated text.
"tools/generate_docs.py" = ["E501"]
"**/migrations/*.py" = ["RUF012", "E501"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests/typing"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Model field types need the django-stubs mypy plugin; the package itself does not.
module = ["tests.testapp.*"]
ignore_errors = true

[tool.pyright]
include = ["src", "tests/typing"]
typeCheckingMode = "strict"
reportUnnecessaryTypeIgnoreComment = "error"
enableTypeIgnoreComments = false
pythonVersion = "3.11"
