version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
    groups:
      development:
        dependency-type: development
  - package-ecosystem: docker
    directory: /docker
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
