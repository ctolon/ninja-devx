name: Documentation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'examples/**', '*.md', 'mkdocs.yml', 'uv.lock', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: {version: '0.11.6', python-version: '3.13'}
      - run: uv sync --locked --group docs
      - run: uv run --no-sync mkdocs build --strict
      - run: uv run --no-sync python tools/check_docs_links.py site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with: {path: site/}
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
